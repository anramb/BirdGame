<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="app-icon.png" type="image/png">
    <link rel="apple-touch-icon" href="app-icon.png">
    <title>Learning Mode</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            padding-bottom: 50px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #333;
            margin: 0;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        select {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #667eea;
            font-size: 0.8em;
            min-width: 200px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn-stop {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
        }
        
        .current-bird {
            background: #f8f9fa;
            color: #333;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .bird-name {
            font-size: 2em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .bird-name-afr {
            font-size: 1.5em;
            color: #666;
            font-style: italic;
            margin-bottom: 15px;
        }
        
        .bird-credit {
            font-size: 0.9em;
            color: #666;
            line-height: 1.6;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
        
        .bird-credit a {
            color: #667eea;
            text-decoration: none;
        }
        
        .bird-credit a:hover {
            text-decoration: underline;
        }
        
        .spectrogram-outer {
            margin: 15px 0;
            background: #1a1a2e;
            border-radius: 10px;
            padding: 8px;
        }
        
        .spectrogram-scroll {
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            height: 220px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .spectrogram-scroll canvas {
            display: block;
            height: 200px;
        }
        
        .spectrogram-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
            background-color: red;
            pointer-events: none;
            z-index: 10;
            display: none;
            box-shadow: 0 0 4px rgba(255,0,0,0.6);
        }
        
        .spectrogram-time-axis {
            height: 18px;
            position: relative;
            color: #aaa;
            font-size: 10px;
            font-family: monospace;
        }
        
        .spectrogram-loading {
            color: #aaa;
            text-align: center;
            padding: 80px 0;
            font-size: 0.95em;
        }
        
        .progress-info {
            text-align: center;
            color: #666;
            margin-top: 10px;
        }
        
        .audio-player {
            width: 100%;
            margin-top: 15px;
        }
        
        .btn-pause {
            background: linear-gradient(135deg, #ffc107 0%, #ffca2c 100%);
            color: #333;
        }
        
        .language-selector {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #667eea;
            font-size: 1em;
            background: white;
        }
        
        .multi-select-container {
            position: relative;
            min-width: 200px;
            width: 100%;
        }
        .multi-select-header {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #667eea;
            font-size: 0.8em;
            background: white;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .multi-select-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 220px;
            overflow-y: auto;
            background: white;
            border: 2px solid #667eea;
            border-top: none;
            border-radius: 0 0 8px 8px;
            z-index: 100;
        }
        .multi-select-list label {
            display: block;
            padding: 7px 10px;
            cursor: pointer;
            font-size: 0.85em;
        }
        .multi-select-list label:hover {
            background: #f0f0ff;
        }
        .multi-select-list input[type="checkbox"] {
            margin-right: 6px;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .controls {
                flex-direction: column;
                gap: 10px;
            }
            
            select, .btn {
                width: 100%;
            }
            
            .bird-name {
                font-size: 1.5em;
            }
            
            .bird-name-afr {
                font-size: 1.2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Learning Mode</h1>
            <button onclick="window.location.href='start.html'" class="btn">← Back</button>
        </div>
        
        <div class="controls">
            <select id="languageSelector" class="language-selector" onchange="changeLanguage()">
                <option value="en">English</option>
                <option value="af">Afrikaans</option>
            </select>
            <select id="filterType">
                <option value="all">All Birds</option>
                <option value="bird">By Bird</option>
                <option value="group">By Group</option>
                <option value="hotspot">By Hotspot</option>
                <option value="habitat">By Habitat</option>
            </select>
            <select id="filterValue" style="display: none;">
                <option value="">Select...</option>
            </select>
            <div id="birdMultiSelect" class="multi-select-container" style="display: none;">
                <div class="multi-select-header" onclick="toggleBirdList()">
                    <span id="birdSelectText">Select Birds...</span>
                    <span>▼</span>
                </div>
                <div id="birdListWrapper" class="multi-select-list" style="display: none; max-height: 300px; padding-top: 0;">
                    <input type="text" id="birdSearchInput" placeholder="Search..." style="width:100%; padding:8px 10px; border:none; border-bottom:1px solid #eee; font-size:0.85em; box-sizing:border-box; position:sticky; top:0; background:white;" oninput="filterBirdList()">
                    <div id="birdList"></div>
                </div>
            </div>
            <div id="hotspotMultiSelect" class="multi-select-container" style="display: none;">
                <div class="multi-select-header" onclick="toggleHotspotList()">
                    <span id="hotspotSelectText">Select Hotspots...</span>
                    <span>▼</span>
                </div>
                <div id="hotspotList" class="multi-select-list" style="display: none;"></div>
            </div>
            <div id="habitatMultiSelect" class="multi-select-container" style="display: none;">
                <div class="multi-select-header" onclick="toggleHabitatList()">
                    <span id="habitatSelectText">Select Habitats...</span>
                    <span>▼</span>
                </div>
                <div id="habitatList" class="multi-select-list" style="display: none;"></div>
            </div>
            <select id="subFilterHabitat" style="display: none;">
                <option value="">All Habitats</option>
            </select>
            <select id="levelFilter">
                <option value="">All Levels</option>
                <option value="1">Beginner</option>
                <option value="2">Intermediate</option>
                <option value="3">Advanced</option>
            </select>
            <button id="startBtn" onclick="startLearning()" class="btn">▶ Start</button>
            <button id="pauseBtn" onclick="pauseResume()" class="btn btn-pause" style="display: none;">⏸ Pause</button>
            <button id="prevBtn" onclick="playPrevious()" class="btn" style="display: none;">⏮ Previous</button>
            <button id="skipBtn" onclick="skipToNext()" class="btn" style="display: none;">⏭ Skip</button>
            <button id="stopBtn" onclick="stopLearning()" class="btn btn-stop" style="display: none;">⏹ Stop</button>
        </div>
        
        <div id="learningDisplay" style="display: none;">
            <div class="current-bird">
                <div class="bird-name" id="birdName"></div>
                <div class="bird-name-afr" id="birdNameAfr"></div>
                <div class="bird-credit" id="birdCredit"></div>
            </div>
            
            <audio id="audioPlayer" class="audio-player" controls></audio>
            
            <div class="spectrogram-outer" id="spectrogramOuter" style="display: none;">
                <div class="spectrogram-scroll" id="spectrogramScroll">
                    <canvas id="spectrogramCanvas"></canvas>
                    <div class="spectrogram-line" id="spectrogramLine"></div>
                </div>
                <div class="spectrogram-time-axis" id="timeAxis"></div>
            </div>
            
            <div id="learnBirdPhotoContainer" style="display: none; text-align: center; margin-top: 15px;">
                <img id="learnBirdPhoto" alt="Bird photo" style="max-width: 100%; max-height: 200px; border-radius: 8px; border: 1px solid #ddd;">
                <div id="learnBirdPhotoCredit" style="font-size: 0.75em; color: #888; margin-top: 4px;"></div>
            </div>
            
            <div class="progress-info" id="progressInfo"></div>
        </div>
    </div>
    
    <script src="allbirds.js"></script>
    <script src="spectrogram-generator.js"></script>
    
    <script>
        let playlist = [];
        let currentIndex = 0;
        let isPlaying = false;
        let isPaused = false;
        let currentLanguage = localStorage.getItem('birdAppLanguage') || 'en';
        let audio = document.getElementById('audioPlayer');
        let spectrogramReady = false;
        let totalCanvasWidth = 0;
        
        // Set language on load
        document.getElementById('languageSelector').value = currentLanguage;
        
        // Change language
        function changeLanguage() {
            currentLanguage = document.getElementById('languageSelector').value;
            localStorage.setItem('birdAppLanguage', currentLanguage);
            updateFilterLabels();
        }
        
        // Update filter labels based on language
        function updateFilterLabels() {
            const filterType = document.getElementById('filterType');
            const levelFilter = document.getElementById('levelFilter');
            if (currentLanguage === 'af') {
                filterType.options[0].text = 'Alle Voëls';
                filterType.options[1].text = 'Per Voël';
                filterType.options[2].text = 'Per Groep';
                filterType.options[3].text = 'Per Hotspot';
                filterType.options[4].text = 'Per Habitat';
                levelFilter.options[0].text = 'Alle Vlakke';
                levelFilter.options[1].text = 'Beginner';
                levelFilter.options[2].text = 'Intermediêr';
                levelFilter.options[3].text = 'Gevorderd';
            } else {
                filterType.options[0].text = 'All Birds';
                filterType.options[1].text = 'By Bird';
                filterType.options[2].text = 'By Group';
                filterType.options[3].text = 'By Hotspot';
                filterType.options[4].text = 'By Habitat';
                levelFilter.options[0].text = 'All Levels';
                levelFilter.options[1].text = 'Beginner';
                levelFilter.options[2].text = 'Intermediate';
                levelFilter.options[3].text = 'Advanced';
            }
        }
        
        const birdgroupMap = {
            cisticolas: "Cisticolas",
            gardenwoodland: "Garden and Woodland",
            groundbirds: "Groundbirds",
            LBJs: "LBJs",
            other: "Other",
            raptors: "Raptors",
            seedeaters: "Seedeaters",
            waders: "Waders",
            warblers: "Warblers",
            waterbirds: "Waterbirds"
        };
        const allData = {};
        const allBirdsArr = typeof allbirds !== 'undefined' ? allbirds : [];
        Object.entries(birdgroupMap).forEach(([key, group]) => {
            allData[key] = allBirdsArr.filter(bird => bird && bird.birdgroup === group);
        });
        
        // Helper: get all birds from allbirds
        function getAllBirds() {
            return typeof allbirds !== 'undefined' ? allbirds : [];
        }
        
        // Helper: get unique values from a semicolon-separated field
        function getUniqueValues(birdsArray, field) {
            const values = new Set();
            birdsArray.forEach(bird => {
                if (bird[field]) {
                    bird[field].split(';').forEach(v => {
                        const trimmed = v.trim();
                        if (trimmed) values.add(trimmed);
                    });
                }
            });
            return Array.from(values).sort();
        }
        
        // Spaceless search: generates keys for original and reversed word order
        function getSearchKeys(name) {
            if (!name) return [];
            const lower = name.toLowerCase();
            const noSpaces = lower.replace(/\s+/g, '');
            const words = lower.split(/\s+/);
            const reversed = words.length > 1 
                ? [...words.slice(1), words[0]].join('') 
                : noSpaces;
            return [noSpaces, reversed];
        }
        
        // === BIRD MULTI-SELECT ===
        function toggleBirdList() {
            const wrapper = document.getElementById('birdListWrapper');
            wrapper.style.display = wrapper.style.display === 'none' ? 'block' : 'none';
            if (wrapper.style.display === 'block') {
                document.getElementById('birdSearchInput').focus();
            }
        }
        
        function getSelectedBirds() {
            const checkboxes = document.querySelectorAll('#birdList input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }
        
        function populateBirdMultiSelect() {
            const container = document.getElementById('birdList');
            const birds = getAllBirds();
            const nameKey = currentLanguage === 'af' ? 'afrikaans' : 'english';
            const sorted = [...birds].sort((a, b) => a[nameKey].localeCompare(b[nameKey]));
            container.innerHTML = '';
            sorted.forEach(bird => {
                const label = document.createElement('label');
                label.dataset.search = bird[nameKey].toLowerCase();
                const enKeys = getSearchKeys(bird.english);
                const afKeys = getSearchKeys(bird.afrikaans);
                label.dataset.searchkeys = [...enKeys, ...afKeys].join('|');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = bird.english;
                cb.addEventListener('change', onBirdSelectionChange);
                label.appendChild(cb);
                label.appendChild(document.createTextNode(' ' + bird[nameKey]));
                container.appendChild(label);
            });
            document.getElementById('birdSelectText').textContent = 
                currentLanguage === 'af' ? 'Kies Voëls...' : 'Select Birds...';
        }
        
        function filterBirdList() {
            const query = document.getElementById('birdSearchInput').value.toLowerCase().replace(/\s+/g, '');
            const labels = document.querySelectorAll('#birdList label');
            labels.forEach(label => {
                if (!query) {
                    label.style.display = 'block';
                    return;
                }
                const keys = label.dataset.searchkeys.split('|');
                label.style.display = keys.some(k => k.includes(query)) ? 'block' : 'none';
            });
        }
        
        function onBirdSelectionChange() {
            const selected = getSelectedBirds();
            if (selected.length === 0) {
                document.getElementById('birdSelectText').textContent = 
                    currentLanguage === 'af' ? 'Kies Voëls...' : 'Select Birds...';
            } else {
                document.getElementById('birdSelectText').textContent = 
                    selected.length + (currentLanguage === 'af' ? ' voël(s) gekies' : ' bird(s) selected');
            }
        }
        
        // === HOTSPOT MULTI-SELECT ===
        function toggleHotspotList() {
            const list = document.getElementById('hotspotList');
            list.style.display = list.style.display === 'none' ? 'block' : 'none';
        }
        
        function getSelectedHotspots() {
            const checkboxes = document.querySelectorAll('#hotspotList input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }
        
        function populateHotspotMultiSelect(birdsArray) {
            const container = document.getElementById('hotspotList');
            const hotspots = getUniqueValues(birdsArray, 'hotspot');
            container.innerHTML = '';
            hotspots.forEach(spot => {
                const label = document.createElement('label');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = spot;
                cb.addEventListener('change', onHotspotSelectionChange);
                label.appendChild(cb);
                label.appendChild(document.createTextNode(' ' + spot));
                container.appendChild(label);
            });
            document.getElementById('hotspotSelectText').textContent = 
                currentLanguage === 'af' ? 'Kies Hotspots...' : 'Select Hotspots...';
        }
        
        function onHotspotSelectionChange() {
            const selected = getSelectedHotspots();
            if (selected.length === 0) {
                document.getElementById('hotspotSelectText').textContent = 
                    currentLanguage === 'af' ? 'Kies Hotspots...' : 'Select Hotspots...';
            } else {
                document.getElementById('hotspotSelectText').textContent = 
                    selected.length + (currentLanguage === 'af' ? ' hotspot(s) gekies' : ' hotspot(s) selected');
            }
            updateSubFilterHabitat();
        }
        
        // === HABITAT MULTI-SELECT ===
        function toggleHabitatList() {
            const list = document.getElementById('habitatList');
            list.style.display = list.style.display === 'none' ? 'block' : 'none';
        }
        
        function getSelectedHabitats() {
            const checkboxes = document.querySelectorAll('#habitatList input[type="checkbox"]:checked');
            return Array.from(checkboxes).map(cb => cb.value);
        }
        
        function populateHabitatMultiSelect(birdsArray) {
            const container = document.getElementById('habitatList');
            const habitats = getUniqueValues(birdsArray || getAllBirds(), 'habitat');
            container.innerHTML = '';
            habitats.forEach(hab => {
                const label = document.createElement('label');
                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.value = hab;
                cb.addEventListener('change', onHabitatSelectionChange);
                label.appendChild(cb);
                label.appendChild(document.createTextNode(' ' + hab));
                container.appendChild(label);
            });
            document.getElementById('habitatSelectText').textContent = 
                currentLanguage === 'af' ? 'Kies Habitats...' : 'Select Habitats...';
        }
        
        function onHabitatSelectionChange() {
            const selected = getSelectedHabitats();
            if (selected.length === 0) {
                document.getElementById('habitatSelectText').textContent = 
                    currentLanguage === 'af' ? 'Kies Habitats...' : 'Select Habitats...';
            } else {
                document.getElementById('habitatSelectText').textContent = 
                    selected.length + (currentLanguage === 'af' ? ' habitat(s) gekies' : ' habitat(s) selected');
            }
        }
        
        // Close multi-select lists when clicking outside
        document.addEventListener('click', function(e) {
            const hotspotContainer = document.getElementById('hotspotMultiSelect');
            if (hotspotContainer && !hotspotContainer.contains(e.target)) {
                document.getElementById('hotspotList').style.display = 'none';
            }
            const birdContainer = document.getElementById('birdMultiSelect');
            if (birdContainer && !birdContainer.contains(e.target)) {
                document.getElementById('birdListWrapper').style.display = 'none';
            }
            const habitatContainer = document.getElementById('habitatMultiSelect');
            if (habitatContainer && !habitatContainer.contains(e.target)) {
                document.getElementById('habitatList').style.display = 'none';
            }
        });
        
        // Update habitat sub-filter based on current context
        function updateSubFilterHabitat() {
            const subFilter = document.getElementById('subFilterHabitat');
            subFilter.innerHTML = '<option value="">' + (currentLanguage === 'af' ? 'Alle Habitats' : 'All Habitats') + '</option>';
            
            const filterType = document.getElementById('filterType').value;
            const selectedHotspots = getSelectedHotspots();
            
            // Determine source birds
            let sourceBirds = getAllBirds();
            if (filterType === 'group') {
                const groupValue = document.getElementById('filterValue').value;
                if (groupValue && allData[groupValue]) {
                    sourceBirds = allData[groupValue];
                }
            }
            
            // Filter by selected hotspots if any
            let matchingBirds = sourceBirds;
            if (selectedHotspots.length > 0) {
                matchingBirds = sourceBirds.filter(bird => 
                    bird.hotspot && selectedHotspots.some(spot => 
                        bird.hotspot.split(';').some(s => s.trim() === spot)
                    )
                );
            }
            
            getUniqueValues(matchingBirds, 'habitat').forEach(hab => {
                const option = document.createElement('option');
                option.value = hab;
                option.textContent = hab;
                subFilter.appendChild(option);
            });
        }
        
        // Update filter options when filter type changes
        document.getElementById('filterType').addEventListener('change', function() {
            const filterValue = document.getElementById('filterValue');
            const subFilterHabitat = document.getElementById('subFilterHabitat');
            const hotspotMultiSelect = document.getElementById('hotspotMultiSelect');
            const birdMultiSelect = document.getElementById('birdMultiSelect');
            const habitatMultiSelect = document.getElementById('habitatMultiSelect');
            const type = this.value;
            
            // Hide all sub-filters by default
            filterValue.style.display = 'none';
            subFilterHabitat.style.display = 'none';
            hotspotMultiSelect.style.display = 'none';
            birdMultiSelect.style.display = 'none';
            habitatMultiSelect.style.display = 'none';
            document.getElementById('hotspotList').style.display = 'none';
            document.getElementById('birdListWrapper').style.display = 'none';
            document.getElementById('habitatList').style.display = 'none';
            
            if (type === 'all') return;
            
            if (type === 'bird') {
                birdMultiSelect.style.display = 'block';
                populateBirdMultiSelect();
            } else if (type === 'group') {
                filterValue.style.display = 'block';
                filterValue.innerHTML = '<option value="">' + (currentLanguage === 'af' ? 'Kies...' : 'Select...') + '</option>';
                Object.keys(allData).forEach(group => {
                    const option = document.createElement('option');
                    option.value = group;
                    option.textContent = group.charAt(0).toUpperCase() + group.slice(1);
                    filterValue.appendChild(option);
                });
            } else if (type === 'hotspot') {
                // Show multi-select hotspot with all hotspots
                hotspotMultiSelect.style.display = 'block';
                populateHotspotMultiSelect(getAllBirds());
                subFilterHabitat.style.display = 'block';
                subFilterHabitat.innerHTML = '<option value="">' + (currentLanguage === 'af' ? 'Alle Habitats' : 'All Habitats') + '</option>';
            } else if (type === 'habitat') {
                habitatMultiSelect.style.display = 'block';
                populateHabitatMultiSelect(getAllBirds());
            }
        });
        
        // When group selection changes, show hotspot + habitat sub-filters
        document.getElementById('filterValue').addEventListener('change', function() {
            const filterType = document.getElementById('filterType').value;
            const hotspotMultiSelect = document.getElementById('hotspotMultiSelect');
            const subFilterHabitat = document.getElementById('subFilterHabitat');
            
            if (filterType === 'group' && this.value) {
                const groupBirds = allData[this.value] || [];
                // Show hotspot multi-select for this group
                hotspotMultiSelect.style.display = 'block';
                populateHotspotMultiSelect(groupBirds);
                // Show habitat sub-filter
                subFilterHabitat.style.display = 'block';
                subFilterHabitat.innerHTML = '<option value="">' + (currentLanguage === 'af' ? 'Alle Habitats' : 'All Habitats') + '</option>';
                getUniqueValues(groupBirds, 'habitat').forEach(hab => {
                    const option = document.createElement('option');
                    option.value = hab;
                    option.textContent = hab;
                    subFilterHabitat.appendChild(option);
                });
            } else if (filterType === 'group') {
                hotspotMultiSelect.style.display = 'none';
                subFilterHabitat.style.display = 'none';
            }
        });
        
        // Spectrogram
        async function generateSpectrogramForBird(audioSrc) {
            spectrogramReady = false;
            totalCanvasWidth = 0;
            
            const result = await generateScrollableSpectrogram(audioSrc, {
                canvas: document.getElementById('spectrogramCanvas'),
                scrollContainer: document.getElementById('spectrogramScroll'),
                line: document.getElementById('spectrogramLine'),
                timeAxis: document.getElementById('timeAxis'),
                outerContainer: document.getElementById('spectrogramOuter'),
                pxPerSec: 75,
                canvasHeight: 200,
                audioElement: audio
            });
            
            spectrogramReady = result.ready;
            totalCanvasWidth = result.totalWidth;
        }
        
        // Start learning
        function startLearning() {
            // If paused, resume instead of restarting
            if (isPaused) {
                isPaused = false;
                isPlaying = true;
                audio.play();
                document.getElementById('pauseBtn').textContent = '⏸ Pause';
                document.getElementById('pauseBtn').classList.remove('btn-pause');
                document.getElementById('pauseBtn').classList.add('btn-pause');
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('pauseBtn').style.display = 'inline-block';
                return;
            }
            
            const filterType = document.getElementById('filterType').value;
            const filterValue = document.getElementById('filterValue').value;
            const subHabitat = document.getElementById('subFilterHabitat').value;
            const levelValue = document.getElementById('levelFilter').value;
            
            // Build playlist
            playlist = [];
            
            const selectedHotspots = getSelectedHotspots();
            const selectedBirds = getSelectedBirds();
            const selectedHabitats = getSelectedHabitats();
            
            if (filterType === 'all') {
                playlist = [...getAllBirds()];
            } else if (filterType === 'bird') {
                if (selectedBirds.length > 0) {
                    playlist = getAllBirds().filter(bird =>
                        selectedBirds.includes(bird.english)
                    );
                }
            } else if (filterType === 'group') {
                if (filterValue && allData[filterValue]) {
                    playlist = [...allData[filterValue]];
                }
                // Apply hotspot filter if any selected
                if (selectedHotspots.length > 0 && playlist.length > 0) {
                    playlist = playlist.filter(bird =>
                        bird.hotspot && selectedHotspots.some(spot =>
                            bird.hotspot.split(';').some(s => s.trim() === spot)
                        )
                    );
                }
                // Apply habitat sub-filter
                if (subHabitat && playlist.length > 0) {
                    playlist = playlist.filter(bird =>
                        bird.habitat && bird.habitat.split(';').some(h => h.trim() === subHabitat)
                    );
                }
            } else if (filterType === 'hotspot') {
                if (selectedHotspots.length > 0) {
                    playlist = getAllBirds().filter(bird =>
                        bird.hotspot && selectedHotspots.some(spot =>
                            bird.hotspot.split(';').some(s => s.trim() === spot)
                        )
                    );
                }
                if (subHabitat && playlist.length > 0) {
                    playlist = playlist.filter(bird =>
                        bird.habitat && bird.habitat.split(';').some(h => h.trim() === subHabitat)
                    );
                }
            } else if (filterType === 'habitat') {
                if (selectedHabitats.length > 0) {
                    playlist = getAllBirds().filter(bird => 
                        bird.habitat && selectedHabitats.some(hab =>
                            bird.habitat.split(';').some(h => h.trim() === hab)
                        )
                    );
                }
            }
            
            // Apply level filter
            if (levelValue && playlist.length > 0) {
                playlist = playlist.filter(bird => 
                    bird.level && bird.level.startsWith(levelValue)
                );
            }
            
            if (playlist.length === 0) {
                alert(currentLanguage === 'af' ? 'Geen voëls gevind vir hierdie keuse' : 'No birds found for this selection');
                return;
            }
            
            // Shuffle playlist
            playlist = playlist.sort(() => Math.random() - 0.5);
            
            currentIndex = 0;
            isPlaying = true;
            isPaused = false;
            
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('pauseBtn').style.display = 'inline-block';
            document.getElementById('prevBtn').style.display = 'inline-block';
            document.getElementById('skipBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'inline-block';
            document.getElementById('learningDisplay').style.display = 'block';
            
            playNext();
        }
        
        // Pause / Resume
        function pauseResume() {
            if (isPaused) {
                // Resume
                isPaused = false;
                isPlaying = true;
                audio.play();
                document.getElementById('pauseBtn').textContent = '⏸ Pause';
            } else {
                // Pause
                isPaused = true;
                isPlaying = false;
                audio.pause();
                document.getElementById('pauseBtn').textContent = '▶ Resume';
            }
        }
        
        // Play next bird
        function playNext() {
            if (!isPlaying) return;
            
            if (currentIndex >= playlist.length) {
                // Loop back to start
                currentIndex = 0;
            }
            
            const bird = playlist[currentIndex];
            
            // Display bird name in selected language
            const birdName = currentLanguage === 'af' ? bird.afrikaans : bird.english;
            const birdNameAlt = currentLanguage === 'af' ? bird.english : bird.afrikaans;
            
            document.getElementById('birdName').textContent = birdName;
            document.getElementById('birdNameAfr').textContent = birdNameAlt;
            
            // Display credit info
            const creditHTML = `
                <strong>Credit:</strong> ${bird.credit}<br>
                <strong>License:</strong> <a href="${bird.licenseLink}" target="_blank">View License</a><br>
                <strong>Changes:</strong> ${bird.changes}
            `;
            document.getElementById('birdCredit').innerHTML = creditHTML;
            
            document.getElementById('progressInfo').textContent = 
                `Bird ${currentIndex + 1} of ${playlist.length}`;
            
            // Display bird photo if available
            const photoContainer = document.getElementById('learnBirdPhotoContainer');
            const photoImg = document.getElementById('learnBirdPhoto');
            const photoCredit = document.getElementById('learnBirdPhotoCredit');
            if (bird.image) {
                photoImg.src = bird.image;
                photoCredit.textContent = bird.photographer ? '© ' + bird.photographer : '';
                photoContainer.style.display = 'block';
                photoImg.onerror = () => { photoContainer.style.display = 'none'; };
            } else {
                photoContainer.style.display = 'none';
            }
            
            // Load audio
            audio.src = bird.audio;
            audio.play();
            
            // Generate spectrogram
            generateSpectrogramForBird(bird.audio);
            
            currentIndex++;
        }
        
        // Play previous bird
        function playPrevious() {
            if (!isPlaying && !isPaused) return;
            // currentIndex points to NEXT bird, so current = currentIndex-1, previous = currentIndex-2
            currentIndex = currentIndex - 2;
            if (currentIndex < 0) currentIndex = playlist.length + currentIndex;
            if (isPaused) {
                isPaused = false;
                isPlaying = true;
                document.getElementById('pauseBtn').textContent = '⏸ Pause';
            }
            audio.pause();
            playNext();
        }
        
        // Skip to next bird
        function skipToNext() {
            if (isPlaying) {
                audio.pause();
                playNext();
            }
        }
        
        // Stop learning
        function stopLearning() {
            isPlaying = false;
            isPaused = false;
            audio.pause();
            audio.currentTime = 0;
            
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('pauseBtn').style.display = 'none';
            document.getElementById('prevBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('skipBtn').style.display = 'none';
            document.getElementById('learningDisplay').style.display = 'none';
            document.getElementById('spectrogramOuter').style.display = 'none';
            document.getElementById('spectrogramLine').style.display = 'none';
            spectrogramReady = false;
            totalCanvasWidth = 0;
        }
        
        // Auto-advance to next bird when audio ends
        audio.addEventListener('ended', function() {
            if (isPlaying && !isPaused) {
                setTimeout(playNext, 1000);
            }
        });
        
        // Spectrogram line tracking
        audio.addEventListener('timeupdate', function() {
            updateSpectrogramLine(audio, document.getElementById('spectrogramLine'), document.getElementById('spectrogramScroll'), totalCanvasWidth, spectrogramReady);
        });
        
        audio.addEventListener('play', function() {
            if (spectrogramReady) {
                document.getElementById('spectrogramLine').style.display = 'block';
                updateSpectrogramLine(audio, document.getElementById('spectrogramLine'), document.getElementById('spectrogramScroll'), totalCanvasWidth, spectrogramReady);
            }
        });
        
        // Click-to-seek on spectrogram
        setupSpectrogramClick(
            document.getElementById('spectrogramScroll'),
            document.getElementById('spectrogramCanvas'),
            audio,
            function() { return totalCanvasWidth; },
            function() { return spectrogramReady; }
        );
    </script>

</body>
