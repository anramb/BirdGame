<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="app-icon.png" type="image/png">
    <link rel="apple-touch-icon" href="app-icon.png">
    <title>Single Bird Select</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 20px;
            padding-bottom: 50px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        h1 {
            color: #333;
            margin: 0;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }
        
        select {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #667eea;
            font-size: 0.8em;
        }
        
        .bird-search-wrapper {
            position: relative;
            flex: 1;
            width: 100%;
        }
        
        .bird-search-wrapper input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #667eea;
            font-size: 0.8em;
            box-sizing: border-box;
        }
        
        .bird-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 250px;
            overflow-y: auto;
            background: white;
            border: 2px solid #667eea;
            border-top: 1px solid #ddd;
            border-radius: 0 0 8px 8px;
            z-index: 100;
            display: none;
        }
        
        .bird-option {
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.8em;
            border-bottom: 1px solid #f0f0f0;
        }
        
        .bird-option:hover {
            background: linear-gradient(135deg, #667eea22, #764ba222);
        }
        
        /* Bird name & species dropdown - adjust font-size here if names are too big/small */
        #speciesFilter {
            font-size: 0.75em;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: bold;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .bird-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .bird-name {
            font-size: 2em;
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .bird-name-afr {
            font-size: 1.5em;
            color: #666;
            font-style: italic;
            margin-bottom: 15px;
        }
        
        .bird-credit {
            font-size: 0.9em;
            color: #666;
            line-height: 1.6;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }
        
        .bird-credit a {
            color: #667eea;
            text-decoration: none;
        }
        
        .bird-credit a:hover {
            text-decoration: underline;
        }
        
        .spectrogram-outer {
            margin: 15px 0;
            background: #1a1a2e;
            border-radius: 10px;
            padding: 8px;
        }
        
        .spectrogram-scroll {
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            height: 220px;
            border-radius: 8px;
            cursor: pointer;
        }
        
        .spectrogram-scroll canvas {
            display: block;
            height: 200px;
        }
        
        .spectrogram-line {
            position: absolute;
            top: 0;
            left: 0;
            width: 2px;
            height: 100%;
            background-color: red;
            pointer-events: none;
            z-index: 10;
            display: none;
            box-shadow: 0 0 4px rgba(255,0,0,0.6);
        }
        
        .spectrogram-time-axis {
            height: 18px;
            position: relative;
            color: #aaa;
            font-size: 10px;
            font-family: monospace;
        }
        
        .spectrogram-loading {
            color: #aaa;
            text-align: center;
            padding: 80px 0;
            font-size: 0.95em;
        }
        
        audio {
            width: 100%;
            margin-top: 20px;
        }
        
        .bird-photo-container {
            text-align: center;
            margin-top: 15px;
        }
        
        .bird-photo-container img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }
        
        .bird-photo-credit {
            font-size: 0.8em;
            color: #888;
            margin-top: 5px;
        }
        
        .language-selector {
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #667eea;
            font-size: 1em;
            background: white;
        }
        
        .call-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 12px 0;
            padding: 10px;
            background: #f0f0ff;
            border-radius: 8px;
        }
        
        .call-btn {
            padding: 6px 14px;
            border-radius: 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .call-btn:hover {
            background: #667eea;
            color: white;
        }
        
        .call-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #764ba2;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.5em;
            }
            
            .controls {
                flex-direction: column;
                gap: 10px;
            }
            
            select, .bird-search-wrapper {
                width: 100%;
            }
            
            /* Bird name font size on mobile - adjust px value here */
            #speciesFilter {
                font-size: 13px;
            }
            
            .bird-name {
                font-size: 1.2em;
                margin-bottom: 2px;
            }
            
            .bird-name-afr {
                font-size: 1em;
            }
            
            .bird-info {
                padding: 8px 5px;
            }
            
            #birdSearch {
                scroll-margin-bottom: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Single Bird Select</h1>
            <button onclick="window.location.href='start.html'" class="btn">← Back</button>
        </div>
        
        <div class="controls">
            <select id="languageSelector" class="language-selector" onchange="changeLanguage()">
                <option value="en">English</option>
                <option value="af">Afrikaans</option>
            </select>
            <select id="speciesFilter" onchange="filterBySpecies()">
                <option value="">All Species</option>
            </select>
            <div class="bird-search-wrapper" id="birdSearchWrapper">
                <input type="text" id="birdSearch" placeholder="Search or select a bird..." oninput="searchBirds()" onfocus="showBirdDropdown()" autocomplete="off">
                <div class="bird-dropdown" id="birdDropdown"></div>
            </div>
        </div>
        
        <div id="birdDisplay" style="display: none;">
            <div class="bird-info">
                <div class="bird-name" id="birdName"></div>
                <div class="bird-name-afr" id="birdNameAfr"></div>
                <div id="callSelector" class="call-selector" style="display: none;"></div>
            </div>

            <!-- Controls above spectrogram -->
            <div style="margin-bottom: 8px; text-align: center;">
                <div style="display: flex; gap: 8px; justify-content: center; margin-bottom: 6px;">
                    <button id="prevBirdBtn" onclick="prevBird()" class="btn" style="flex: 1; padding: 8px;">◀ Previous</button>
                    <button id="playPauseBtn" onclick="togglePlayPause()" class="btn" style="flex: 0.8; padding: 8px; background: linear-gradient(135deg, #ffc107 0%, #ffca2c 100%); color: #333;">⏸ Pause</button>
                    <button id="nextBirdBtn" onclick="nextBird()" class="btn" style="flex: 1; padding: 8px;">Next Bird ▶</button>
                </div>
            </div>

            <!-- Spectrogram -->
            <div class="spectrogram-outer" id="spectrogramOuter" style="display: none;">
                <div class="spectrogram-scroll" id="spectrogramScroll">
                    <canvas id="spectrogramCanvas"></canvas>
                    <div class="spectrogram-line" id="spectrogramLine"></div>
                </div>
                <div class="spectrogram-time-axis" id="timeAxis"></div>
            </div>
            
            <audio id="audioPlayer" controls></audio>

            <!-- Credit below spectrogram -->
            <div class="bird-credit" id="birdCredit" style="font-size: 0.8em; color: #888; margin-top: 8px; padding: 8px; background: #f8f9fa; border-radius: 6px; line-height: 1.5;"></div>
            
            <!-- Photo at bottom -->
            <div class="bird-photo-container" id="birdPhotoContainer" style="display: none;">
                <img id="birdPhoto" alt="Bird photo">
                <div class="bird-photo-credit" id="birdPhotoCredit"></div>
            </div>
        </div>
        <div id="totalBirdCalls" style="text-align: center; margin-top: 20px; padding: 10px; color: #667eea; font-size: 0.85em; font-weight: 600;"></div>
    </div>
    
    <div style="position: fixed; bottom: 0; left: 0; right: 0; text-align: center; padding: 8px; background: rgba(255,255,255,0.9); color: #666; font-size: 0.7em; z-index: 1000;">Created by Marna Buys with Windsurf</div>
    <script data-goatcounter="https://anramb.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    
    <script src="allbirds.js"></script>
    <script src="maintenance-check.js"></script>
    <script src="spectrogram-generator.js"></script>
    
    <script>
        let currentBird = null;
        let currentLanguage = localStorage.getItem('birdAppLanguage') || 'en';
        let currentSpeciesFilter = '';
        let filteredBirds = [];  // grouped species list for dropdown navigation
        let audio = document.getElementById('audioPlayer');
        let currentSpeciesGroup = []; // all entries for currently selected species
        
        // === SPECIES GROUPING LOGIC ===
        const CALL_SUFFIXES = [
            'song & immitation', 'song & imitation',
            'interaction m & f', 'male & female',
            '2 birds interacting', 'advertising call',
            'alarm call', 'territorial call', 'contact call',
            'flight call', 'call variation', 'variation of call',
            'call male', 'call female', 'courting male',
            'duet', 'song', 'drumming', 'additional',
            'immature', 'adult', 'juvenile', 
            'male', 'female',
            'call',
            'ec', 'wc'
        ];
        
        // Priority for selecting base entry (lower = better)
        const BASE_PRIORITY = {
            'base': 0,
            'call': 1,
            'song': 2,
            'contact call': 3,
            'duet': 4,
            'drumming': 4,
            'call male': 5,
            'call female': 5,
            'courting male': 5,
            'advertising call': 5,
            'flight call': 5,
            'territorial call': 6,
            'alarm call': 7,
            'call variation': 8,
            'variation of call': 8,
            'song & immitation': 8,
            'song & imitation': 8,
            'additional': 9,
            '2 birds interacting': 9,
            'interaction m & f': 9,
            'male & female': 9,
            'male': 10,
            'female': 10,
            'adult': 10,
            'immature': 10,
            'juvenile': 10,
            'ec': 11,
            'wc': 11
        };
        
        function getCallSuffix(name) {
            const lower = name.toLowerCase().trim();
            for (const s of CALL_SUFFIXES) {
                if (lower.endsWith(' ' + s)) return s;
            }
            // Check for numbered variants (e.g. "2", "3")
            const numMatch = lower.match(/\s(\d+)$/);
            if (numMatch) return numMatch[1];
            return null;
        }
        
        function getBaseName(name) {
            let result = name.trim();
            let changed = true;
            while (changed) {
                changed = false;
                const lower = result.toLowerCase();
                for (const s of CALL_SUFFIXES) {
                    if (lower.endsWith(' ' + s)) {
                        result = result.substring(0, result.length - s.length - 1).trim();
                        changed = true;
                        break;
                    }
                }
                if (!changed) {
                    // Check for numbered variants
                    const numMatch = result.match(/\s\d+$/);
                    if (numMatch) {
                        result = result.substring(0, result.length - numMatch[0].length).trim();
                        changed = true;
                    }
                }
            }
            return result;
        }
        
        function getCallLabel(name, baseName) {
            if (name === baseName) return 'Main Call';
            const suffix = name.substring(baseName.length).trim();
            // Capitalize first letter
            return suffix.charAt(0).toUpperCase() + suffix.slice(1);
        }
        
        // Group all birds by base species name
        function groupBirdsBySpecies() {
            const groups = {};
            allbirds.forEach(bird => {
                if (bird.exclude === true || bird.exclude === 'true') return;
                const base = getBaseName(bird.english);
                if (!groups[base]) groups[base] = [];
                groups[base].push(bird);
            });
            
            // Sort entries within each group by priority
            Object.values(groups).forEach(entries => {
                entries.sort((a, b) => {
                    const aSuffix = getCallSuffix(a.english);
                    const bSuffix = getCallSuffix(b.english);
                    const aPri = aSuffix ? (BASE_PRIORITY[aSuffix] || 9) : 0;
                    const bPri = bSuffix ? (BASE_PRIORITY[bSuffix] || 9) : 0;
                    return aPri - bPri;
                });
            });
            
            return groups;
        }
        
        // Get species (first word) from name - for species filter
        function getSpecies(name) {
            return name.split(' ')[0];
        }
        
        // Populate species filter dropdown
        function populateSpeciesFilter() {
            const filter = document.getElementById('speciesFilter');
            if (typeof allbirds === 'undefined' || !Array.isArray(allbirds)) return;
            
            const nameKey = currentLanguage === 'af' ? 'afrikaans' : 'english';
            const activeBirds = allbirds.filter(b => b.exclude !== true && b.exclude !== 'true');
            const species = [...new Set(activeBirds.map(b => getSpecies(b[nameKey])))].sort();
            const allLabel = currentLanguage === 'af' ? 'Alle Spesies' : 'All Species';
            filter.innerHTML = `<option value="">${allLabel}</option>`;
            species.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                filter.appendChild(opt);
            });
            if (currentSpeciesFilter && species.includes(currentSpeciesFilter)) {
                filter.value = currentSpeciesFilter;
            } else {
                currentSpeciesFilter = '';
            }
        }
        
        // Filter by species
        function filterBySpecies() {
            currentSpeciesFilter = document.getElementById('speciesFilter').value;
            populateBirdSelector();
            document.getElementById('birdDisplay').style.display = 'none';
        }
        
        // Change language
        function changeLanguage() {
            currentLanguage = document.getElementById('languageSelector').value;
            localStorage.setItem('birdAppLanguage', currentLanguage);
            currentSpeciesFilter = '';
            document.getElementById('birdSearch').value = '';
            populateSpeciesFilter();
            populateBirdSelector();
            if (currentBird) {
                displayBird();
            }
        }
        
        // Spaceless search: generates keys for original and reversed word order
        function getSearchKeys(name) {
            if (!name) return [];
            const lower = name.toLowerCase();
            const noSpaces = lower.replace(/\s+/g, '');
            const words = lower.split(/\s+/);
            const reversed = words.length > 1 
                ? [...words.slice(1), words[0]].join('') 
                : noSpaces;
            return [noSpaces, reversed];
        }
        
        function searchBirds() {
            populateBirdSelector();
            showBirdDropdown();
        }
        
        function showBirdDropdown() {
            var searchInput = document.getElementById('birdSearch');
            if (currentBird) {
                var nk = currentLanguage === 'af' ? 'afrikaans' : 'english';
                var baseName = getBaseName(currentBird[nk]);
                if (searchInput.value === baseName || searchInput.value === currentBird[nk]) {
                    searchInput.value = '';
                    populateBirdSelector();
                }
            }
            document.getElementById('birdDropdown').style.display = 'block';
        }
        
        function hideBirdDropdown() {
            document.getElementById('birdDropdown').style.display = 'none';
        }
        
        function selectBirdFromDropdown(index) {
            const speciesEntry = filteredBirds[index];
            currentBirdIndex = index;
            currentBird = speciesEntry.entries[0]; // Select base/primary entry
            currentSpeciesGroup = speciesEntry.entries;
            var nameKey = currentLanguage === 'af' ? 'afrikaans' : 'english';
            document.getElementById('birdSearch').value = speciesEntry.displayName;
            document.getElementById('birdSearch').blur();
            hideBirdDropdown();
            displayBird();
        }
        
        // Populate bird dropdown - now shows grouped species
        function populateBirdSelector() {
            var dropdown = document.getElementById('birdDropdown');
            
            if (typeof allbirds === 'undefined' || !Array.isArray(allbirds)) {
                dropdown.innerHTML = '<div class="bird-option" style="color:#999;">No birds available</div>';
                return;
            }
            
            var nameKey = currentLanguage === 'af' ? 'afrikaans' : 'english';
            var searchInput = document.getElementById('birdSearch');
            var query = searchInput ? searchInput.value.toLowerCase().replace(/\s+/g, '') : '';
            
            // Build grouped species list
            const groups = groupBirdsBySpecies();
            
            // Create display list with base names
            let speciesList = Object.entries(groups).map(([baseName, entries]) => {
                // Use the base entry's name in selected language, or derive from first entry
                const primaryEntry = entries[0];
                const displayName = currentLanguage === 'af' 
                    ? getBaseName(primaryEntry.afrikaans)
                    : baseName;
                return {
                    baseName: baseName,
                    displayName: displayName,
                    entries: entries,
                    callCount: entries.length
                };
            });
            
            // Filter by species (first word) if selected
            if (currentSpeciesFilter) {
                speciesList = speciesList.filter(s => getSpecies(s.displayName) === currentSpeciesFilter);
            }
            
            // Filter by search query
            if (query) {
                speciesList = speciesList.filter(species => {
                    // Search across all entries in the group
                    return species.entries.some(bird => {
                        var keys = [...getSearchKeys(bird.english), ...getSearchKeys(bird.afrikaans)];
                        return keys.some(k => k.includes(query));
                    });
                });
            }
            
            // Sort by display name
            speciesList.sort((a, b) => a.displayName.localeCompare(b.displayName));
            
            filteredBirds = speciesList;
            
            // Populate dropdown
            dropdown.innerHTML = '';
            if (speciesList.length === 0) {
                dropdown.innerHTML = '<div class="bird-option" style="color:#999;">No results</div>';
                return;
            }
            
            speciesList.forEach((species, index) => {
                var div = document.createElement('div');
                div.className = 'bird-option';
                var label = species.displayName;
                if (species.callCount > 1) {
                    label += ' (' + species.callCount + ' calls)';
                }
                div.textContent = label;
                div.addEventListener('mousedown', function(e) { e.preventDefault(); });
                div.addEventListener('click', function() { selectBirdFromDropdown(index); });
                dropdown.appendChild(div);
            });
        }
        
        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            var wrapper = document.getElementById('birdSearchWrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                hideBirdDropdown();
            }
        });
        
        let currentBirdIndex = -1;
        
        function prevBird() {
            if (!filteredBirds || filteredBirds.length === 0) return;
            currentBirdIndex = (currentBirdIndex - 1 + filteredBirds.length) % filteredBirds.length;
            const speciesEntry = filteredBirds[currentBirdIndex];
            currentBird = speciesEntry.entries[0];
            currentSpeciesGroup = speciesEntry.entries;
            var nameKey = currentLanguage === 'af' ? 'afrikaans' : 'english';
            document.getElementById('birdSearch').value = speciesEntry.displayName;
            displayBird();
        }
        
        function nextBird() {
            if (!filteredBirds || filteredBirds.length === 0) return;
            currentBirdIndex = (currentBirdIndex + 1) % filteredBirds.length;
            const speciesEntry = filteredBirds[currentBirdIndex];
            currentBird = speciesEntry.entries[0];
            currentSpeciesGroup = speciesEntry.entries;
            var nameKey = currentLanguage === 'af' ? 'afrikaans' : 'english';
            document.getElementById('birdSearch').value = speciesEntry.displayName;
            displayBird();
        }
        
        // Switch to a specific call within the current species group
        function selectCall(index) {
            currentBird = currentSpeciesGroup[index];
            playCurrentCall();
            updateCallButtons(index);
        }
        
        function updateCallButtons(activeIndex) {
            const buttons = document.querySelectorAll('#callSelector .call-btn');
            buttons.forEach((btn, i) => {
                btn.classList.toggle('active', i === activeIndex);
            });
        }
        
        function playCurrentCall() {
            // Update credit
            const creditHTML = `
                <strong>Credit:</strong> ${currentBird.credit}<br>
                <strong>License:</strong> <a href="${currentBird.licenseLink}" target="_blank">View License</a><br>
                <strong>Changes:</strong> ${currentBird.changes}
            `;
            document.getElementById('birdCredit').innerHTML = creditHTML;
            
            // Generate spectrogram and play
            generateSpectrogramForBird(currentBird.audio);
            audio.src = currentBird.audio;
            audio.play();
            
            // Update photo
            showBirdPhoto();
        }
        
        function showBirdPhoto() {
            const photoContainer = document.getElementById('birdPhotoContainer');
            const photoImg = document.getElementById('birdPhoto');
            const photoCredit = document.getElementById('birdPhotoCredit');
            if (currentBird.image) {
                photoImg.onload = function() {
                    photoContainer.style.display = 'block';
                };
                photoImg.onerror = function() {
                    photoContainer.style.display = 'none';
                };
                photoImg.src = currentBird.image;
                photoCredit.textContent = currentBird.photographer ? '© ' + currentBird.photographer : '';
            } else {
                photoContainer.style.display = 'none';
            }
        }
        
        // Display bird - now shows call selector if multiple entries exist
        function displayBird() {
            if (!currentBird) return;
            
            const baseName = getBaseName(currentBird.english);
            const baseNameAfr = getBaseName(currentBird.afrikaans);
            const mainName = currentLanguage === 'af' ? baseNameAfr : baseName;
            const altName = currentLanguage === 'af' ? baseName : baseNameAfr;
            document.getElementById('birdName').textContent = mainName;
            document.getElementById('birdNameAfr').textContent = altName;
            
            // Show call selector if species has multiple entries
            const callSelector = document.getElementById('callSelector');
            if (currentSpeciesGroup.length > 1) {
                callSelector.innerHTML = '';
                currentSpeciesGroup.forEach((entry, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'call-btn' + (entry === currentBird ? ' active' : '');
                    btn.textContent = getCallLabel(entry.english, baseName);
                    btn.addEventListener('click', function() { selectCall(i); });
                    callSelector.appendChild(btn);
                });
                callSelector.style.display = 'flex';
            } else {
                callSelector.style.display = 'none';
            }
            
            // Display credit info
            const creditHTML = `
                <strong>Credit:</strong> ${currentBird.credit}<br>
                <strong>License:</strong> <a href="${currentBird.licenseLink}" target="_blank">View License</a><br>
                <strong>Changes:</strong> ${currentBird.changes}
            `;
            document.getElementById('birdCredit').innerHTML = creditHTML;
            
            // Generate scrollable spectrogram from audio
            generateSpectrogramForBird(currentBird.audio);
            
            // Load audio and auto-play
            audio.src = currentBird.audio;
            audio.play();
            
            // Show bird photo
            showBirdPhoto();
            
            document.getElementById('birdDisplay').style.display = 'block';
        }
        
        // Spectrogram
        let spectrogramReady = false;
        let totalCanvasWidth = 0;
        const canvas = document.getElementById('spectrogramCanvas');
        const spectrogramLine = document.getElementById('spectrogramLine');
        const spectrogramOuter = document.getElementById('spectrogramOuter');
        const spectrogramScroll = document.getElementById('spectrogramScroll');
        const timeAxis = document.getElementById('timeAxis');
        
        async function generateSpectrogramForBird(audioSrc) {
            spectrogramReady = false;
            totalCanvasWidth = 0;
            
            const result = await generateScrollableSpectrogram(audioSrc, {
                canvas: canvas,
                scrollContainer: spectrogramScroll,
                line: spectrogramLine,
                timeAxis: timeAxis,
                outerContainer: spectrogramOuter,
                pxPerSec: 95,
                canvasHeight: 200,
                audioElement: audio
            });
            
            spectrogramReady = result.ready;
            totalCanvasWidth = result.totalWidth;
        }
        
        audio.addEventListener('timeupdate', function() {
            updateSpectrogramLine(audio, spectrogramLine, spectrogramScroll, totalCanvasWidth, spectrogramReady);
        });
        
        audio.addEventListener('play', function() {
            if (spectrogramReady) {
                spectrogramLine.style.display = 'block';
                updateSpectrogramLine(audio, spectrogramLine, spectrogramScroll, totalCanvasWidth, spectrogramReady);
            }
        });
        
        audio.addEventListener('ended', function() {
            spectrogramLine.style.display = 'none';
            document.getElementById('playPauseBtn').textContent = '▶ Play';
        });
        
        audio.addEventListener('play', function() {
            document.getElementById('playPauseBtn').textContent = '⏸ Pause';
        });
        
        audio.addEventListener('pause', function() {
            document.getElementById('playPauseBtn').textContent = '▶ Play';
        });
        
        function togglePlayPause() {
            if (!audio.src) return;
            if (audio.paused) {
                audio.play();
            } else {
                audio.pause();
            }
        }
        
        setupSpectrogramClick(spectrogramScroll, canvas, audio,
            function() { return totalCanvasWidth; },
            function() { return spectrogramReady; }
        );
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            // Set language from localStorage
            document.getElementById('languageSelector').value = currentLanguage;
            populateSpeciesFilter();
            populateBirdSelector();
            if (typeof allbirds !== 'undefined') {
                const activeBirds = allbirds.filter(b => b.exclude !== true && b.exclude !== 'true');
                const speciesCount = Object.keys(groupBirdsBySpecies()).length;
                document.getElementById('totalBirdCalls').textContent = 
                    'Species: ' + speciesCount + ' | Total Calls: ' + activeBirds.length;
            }
            // Scroll search input into view when keyboard opens on mobile
            var searchInput = document.getElementById('birdSearch');
            if (searchInput) {
                searchInput.addEventListener('focus', function() {
                    setTimeout(function() {
                        searchInput.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }, 350);
                });
            }
        });
    </script>
</body>
</html>
